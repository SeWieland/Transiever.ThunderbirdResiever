name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag whose assets should be rebuilt
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      inputs.release_tag == ''
    environment: release
    outputs:
      release_tag: ${{ steps.semantic-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: dotnet restore Transiever.ThunderbirdResiever.slnx
      - run: dotnet build Transiever.ThunderbirdResiever.slnx --configuration Release --no-restore --warnaserror
      - run: dotnet test Transiever.ThunderbirdResiever.slnx --configuration Release --no-build
      - name: Create draft release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  select-tag:
    name: Select release tag
    runs-on: ubuntu-latest
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    outputs:
      release_tag: ${{ steps.select.outputs.release_tag }}
    steps:
      - id: select
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RELEASED_TAG: ${{ needs.release.outputs.release_tag }}
        run: echo "release_tag=${REQUESTED_TAG:-$RELEASED_TAG}" >> "$GITHUB_OUTPUT"

  build-assets:
    name: Build ${{ matrix.rid }} asset
    needs: select-tag
    if: needs.select-tag.outputs.release_tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            extension: zip
            executable: tbrx.exe
          - os: ubuntu-latest
            rid: linux-x64
            extension: tar.gz
            executable: tbrx
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-tag.outputs.release_tag }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Linux Native AOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev
      - name: Build and inspect archive
        run: bash .github/scripts/build-release-assets.sh "${{ needs.select-tag.outputs.release_tag }}" "${{ matrix.rid }}"
      - name: Smoke test help and synthetic export
        run: |
          executable="./artifacts/publish/${{ matrix.rid }}/${{ matrix.executable }}"
          "$executable" --help
          smoke="$(mktemp -d)"
          bash .github/scripts/create-smoke-profile.sh "$smoke"
          "$executable" export --profile "$smoke/profile" --rules "$smoke/rules.json"
          grep -q 'Synthetic smoke rule' "$smoke/rules.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/tbrx-${{ needs.select-tag.outputs.release_tag }}-${{ matrix.rid }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1

  attach-assets:
    name: Attach assets and publish beta
    runs-on: ubuntu-latest
    needs: [select-tag, build-assets]
    if: needs.select-tag.outputs.release_tag != '' && needs.build-assets.result == 'success'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.select-tag.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  update-homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    needs: [release, select-tag, attach-assets]
    if: >-
      always() &&
      needs.attach-assets.result == 'success' &&
      needs.release.outputs.release_tag != ''
    permissions:
      contents: read

    steps:
      - name: Update tbrx formula
        uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: tbrx
          formula-path: Formula/tbrx.rb
          homebrew-tap: SeWieland/homebrew-transiever
          base-branch: main
          tag-name: ${{ needs.select-tag.outputs.release_tag }}
          download-url: https://github.com/SeWieland/Transiever.ThunderbirdResiever/releases/download/${{ needs.select-tag.outputs.release_tag }}/tbrx-${{ needs.select-tag.outputs.release_tag }}-linux-x64.tar.gz
          create-pullrequest: true
        env:
          # Fine-grained PAT restricted to the Homebrew tap with Contents and Pull requests write access.
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
